## A build target for this machine.
##
## It is linux-generic32 with three things taken away, each because this
## is a freestanding m68k toolchain rather than a Linux distribution:
##
##   -pthread   m68k-elf-gcc has no such option and refuses the whole
##              compilation ("unrecognized command-line option
##              '-pthread'"). The flag's job on Linux is to define
##              _REENTRANT and link libpthread; here threads are IN
##              libc, and picolibc is built with threads enabled, so
##              there is nothing for it to do
##   -ldl       there is no libdl, because there is no dlopen. Built
##              with no-dso, OpenSSL never asks for one
##   afalgeng   Linux's kernel crypto socket family; this kernel has
##              no AF_ALG
##
## Everything else -- BN_LLONG, the generic 32-bit C code paths -- is
## what linux-generic32 chose, and is right here too. The byte order
## comes in as -DB_ENDIAN from build.sh, not from this file, so that
## the one place it is set is next to the test that checks it.

my %targets = (
    "sage040" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "m68k-elf-gcc",
        CFLAGS           => picker(default => "-Wall",
                                   debug   => "-O0 -g",
                                   release => "-O2"),
        cflags           => "",
        lib_cppflags     => "",
        ex_libs          => "",
        bn_ops           => "BN_LLONG RC4_CHAR",
        thread_scheme    => "pthreads",
        dso_scheme       => "",
        perlasm_scheme   => "void",
        disable          => [ "afalgeng", "asm", "dso", "shared" ],
    },
);
