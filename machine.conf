#
# machine.conf - how big the machine is, in one place.
#
# Deliberately written so that it is valid in BOTH GNU make and POSIX
# shell: `NAME=value` with no spaces around the `=`. Makefiles include
# it, scripts source it, and neither has to know the other exists.
#
#     TOPDIR := ..
#     include $(TOPDIR)/machine.conf        # in a Makefile
#     . "$TOPDIR/machine.conf"              # in a script
#
# These were scattered across eleven Makefiles and shell scripts as a
# literal `-m 4`, which is how the emulator ended up being given more
# memory than the kernel could see without anybody noticing.
#
# The emulator accepts up to 2 GB. The kernel sizes RAM at run time and
# the page allocator scales with it, so raising RAM_MB is the only step
# needed -- nothing is compiled in.

# RAM, in megabytes.
RAM_MB=64

# The hard disk, in megabytes.
#
# FAT16 addresses at most 65524 clusters, so anything past ~128 MB needs
# clusters larger than 2 KB; mkfs.fat picks a size that fits. 512 MB
# lands on 8 KB clusters, which wastes some space per file and is of no
# consequence on a disk this size.
DISK_MB=512
